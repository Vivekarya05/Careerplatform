<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My job matches</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Job matches</h1>
    <div class="controls">
      <label for="min-score">Min match score:</label>
      <input type="range" id="min-score" min="0" max="100" value="40">
      <span id="min-score-label">40%</span>
    </div>
  </header>

  <main id="job-list">
    <p id="loading">Loading jobs...</p>
  </main>

  <script src="app.js"></script>
</body>
</html>

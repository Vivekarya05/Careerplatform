[project]
name = "career-intelligence-backend"
version = "0.1.0"
description = "FastAPI backend for Vivek's AI Job Intelligence Platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "httpx>=0.27.0",
  "openai>=1.35.0",
  "supabase>=2.5.0",
  "python-dotenv>=1.0.1",
  "email-validator>=2.1.1",
  "PyJWT>=2.8.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.2.0",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["../tests/backend"]
